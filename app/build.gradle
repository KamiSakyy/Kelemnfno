plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.kelemnfno.anime'
    compileSdk 36

    defaultConfig {
        applicationId "ru.kelemnfno.anime"
        minSdk 24
        targetSdk 35
        versionCode 30
        versionName "1.5.0"

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                cFlags "-O2", "-fvisibility=hidden"
            }
        }

        vectorDrawables.useSupportLibrary = true
        resourceConfigurations += ['ru', 'en']
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    signingConfigs {
        release {
            def props = new Properties()
            def propsFile = rootProject.file('keystore.properties')
            if (propsFile.exists()) propsFile.withInputStream { props.load(it) }
            def store = rootProject.file(props.getProperty('storeFile', 'keystore/release.keystore'))
            if (store.exists()) {
                storeFile store
                storePassword props.getProperty('storePassword', 'kelemnfno')
                keyAlias props.getProperty('keyAlias', 'kelemnfno')
                keyPassword props.getProperty('keyPassword', 'kelemnfno')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
            minifyEnabled false
            shrinkResources false
            debuggable true
            versionNameSuffix "-debug"
        }
        release {
            // R8 в полном режиме: имена классов и методов заменяются, лишнее вырезается
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/*.kotlin_module']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

configurations.all {
    resolutionStrategy.force 'com.squareup.okhttp3:okhttp:5.4.0'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.3'

    // --- UI (Material 3, динамические цвета, анимации) ---
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'

    // --- Архитектура ---
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.7'

    // --- База данных (Room) ---
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // --- Фоновые задачи и уведомления ---
    implementation 'androidx.work:work-runtime:2.9.1'

    // --- Сеть (Retrofit + OkHttp + Gson) ---
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:5.4.0'
    implementation 'com.google.code.gson:gson:2.11.0'

    // --- Изображения ---
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // --- Плеер: Media3 / ExoPlayer (HLS, DASH, плавный ABR, субтитры) ---
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
    implementation 'androidx.media3:media3-session:1.5.1'
}
