name: probe
on:
  push:
    branches: [arena/01a0afbd-kelemnfno]
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          UA='Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36'
          {
            echo '=== search releases (raw head) ==='
            curl -sS -A "$UA" 'https://anilibria.top/api/v1/app/search/releases?query=Issho%20ni%20Ecchi&limit=2' | head -c 400
            echo
            echo '=== search releases ascii query ==='
            curl -sS -A "$UA" 'https://anilibria.top/api/v1/app/search/releases?query=ecchi&limit=2' | head -c 400
          } > probe-result.txt 2>&1
      - name: commit result
        run: |
          git config user.name "probe"
          git config user.email "probe@local"
          git add probe-result.txt
          git commit -m "probe result 4" || true
          git pull --rebase
          git push
