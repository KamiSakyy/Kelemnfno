name: probe
on:
  push:
    paths:
      - '.github/workflows/probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          OUT=probe-result.txt
          : > $OUT
          curl -s --max-time 25 -H "User-Agent: $UA" "https://anilibria.top/api/v1/anime/genres" -o /tmp/genres.json
          python3 - <<'PY' >> $OUT
          import json
          d=json.load(open('/tmp/genres.json'))
          arr=d if isinstance(d,list) else d.get('data',[])
          print('GENRES sample keys:', sorted(arr[0].keys()) if arr else 'none')
          for g in arr:
              print(f'G {g.get("id")} | {g.get("name") or g.get("title")} | {g.get("slug","")}')
          PY
          for id in $(python3 -c "
          import json
          d=json.load(open('/tmp/genres.json'))
          arr=d if isinstance(d,list) else d.get('data',[])
          print(' '.join(str(g.get('id')) for g in arr))"); do
            curl -s --max-time 20 -H "User-Agent: $UA" "https://anilibria.top/api/v1/anime/catalog/releases?f%5Bgenres%5D=$id&limit=50" -o /tmp/g$id.json
          done
          python3 - <<'PY' >> $OUT
          import json
          d=json.load(open('/tmp/genres.json'))
          arr=d if isinstance(d,list) else d.get('data',[])
          for g in arr:
              gid=g.get('id'); nm=g.get('name') or g.get('title')
              try:
                  c=json.load(open(f'/tmp/g{gid}.json'))
                  items=c.get('data',[]) if isinstance(c,dict) else []
                  meta=c.get('meta',{}).get('pagination',{}) if isinstance(c,dict) else {}
                  print(f'GENRE {gid} {nm} total={meta.get("total")}')
                  if nm and 'ентай' in str(nm):
                      for r in items:
                          n=r.get('name',{})
                          print(f'  H {r.get("id")} | {n.get("main")} | {n.get("english")} | eps={r.get("episodes_total")}')
              except Exception as e:
                  print(f'GENRE {gid} {nm} ERR {e}')
          PY
          cat $OUT | head -140
      - name: push result
        run: |
          git config user.name "probe"
          git config user.email "probe@local"
          git add probe-result.txt
          git commit -m "probe result 4 [skip ci]" || echo nothing
          git push origin HEAD:arena/01a0afbd-kelemnfno || echo pushfail
