name: probe
on:
  push:
    paths:
      - '.github/workflows/probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          python3 - <<'PY2'
          import json,urllib.request,urllib.parse
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          AL={'User-Agent':UA,'Accept':'application/json','Accept-Language':'ru-RU,ru;q=0.9','Origin':'https://animelib.org','Referer':'https://animelib.org/'}
          out=[]
          def getj(url,h):
              r=urllib.request.Request(url,headers=h)
              with urllib.request.urlopen(r,timeout=20) as resp: return json.loads(resp.read().decode('utf-8','ignore'))
          for q in ['История приключений с девушкой-зайкой','Секс вдвоём','История парочки','зайкой']:
              try:
                  d=getj('https://api.cdnlibs.org/api/anime?page=1&q='+urllib.parse.quote(q),AL)
                  rows=d.get('data',[])
                  out.append(f'== AL q={q} count={len(rows)}')
                  for r in rows[:5]:
                      out.append(f"   slug={r.get('slug_url')} rus={r.get('rus_name')} eng={r.get('eng_name')} shiki={r.get('shikimori_href')}")
                  if rows:
                      slug=rows[0].get('slug_url')
                      e=getj('https://api.cdnlibs.org/api/episodes?anime_id='+urllib.parse.quote(str(slug)),AL)
                      eps=e.get('data',[])
                      out.append(f'   EPISODES {slug}: {len(eps)}')
                      if eps:
                          eid=eps[0].get('id')
                          det=getj(f'https://api.cdnlibs.org/api/episodes/{eid}',AL)
                          players=(det.get('data') or {}).get('videoPlayerData',{}).get('players') or (det.get('data') or {}).get('players') or []
                          out.append(f'   ep {eid} players={len(players)}')
                          for p in players[:3]:
                              team=(p.get('team') or {}).get('title')
                              out.append(f"     player src={str(p.get('src'))[:110]} team={team} type={(p.get('translation_type') or {}).get('label')}")
                          if players:
                              src0=players[0].get('src') or ''
                              if src0.startswith('//'): src0='https:'+src0
                              try:
                                  r=urllib.request.Request(src0,headers={'User-Agent':UA})
                                  with urllib.request.urlopen(r,timeout=20) as resp:
                                      out.append(f'     PLAYER PAGE status={resp.status} len={len(resp.read())}')
                              except Exception as ex:
                                  out.append(f'     PLAYER PAGE ERR {ex}')
              except Exception as ex:
                  out.append(f'== AL q={q} ERR {str(ex)[:150]}')
          # shikimori: полные ответы
          try:
              d=getj('https://shikimori.one/api/animes?search='+urllib.parse.quote('девушкой-зайкой')+'&limit=3',{'User-Agent':'KelemnfnoApp'})
              for a in d:
                  out.append(f"SHIKI id={a['id']} ru={a.get('russian')} name={a.get('name')}")
          except Exception as ex:
              out.append(f'SHIKI ERR {ex}')
          open('probe-result.txt','w').write('\n'.join(out)+'\n')
          print('\n'.join(out)[:3000])
          PY2
      - name: push result
        run: |
          git config user.name "probe"
          git config user.email "probe@local"
          git add probe-result.txt
          git commit -m "probe result 14 [skip ci]" || echo nothing
          git push origin HEAD:arena/01a0afbd-kelemnfno || echo pushfail
