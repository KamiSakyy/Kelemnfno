name: probe
on:
  push:
    paths:
      - '.github/workflows/probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          OUT=probe-result.txt
          : > $OUT
          q() {
            local name="$1"; local url="$2"
            local code=$(curl -s -o /tmp/q.json -w "%{http_code}" --max-time 20 -H "User-Agent: $UA" -H "Accept: application/json" "$url")
            echo "== $name HTTP $code size $(stat -c%s /tmp/q.json 2>/dev/null || echo 0)" >> $OUT
            python3 - "$name" <<'PY' >> $OUT
          import json,sys
          name=sys.argv[1]
          try: d=json.load(open('/tmp/q.json'))
          except Exception as e: print(f'{name} PARSE-ERR {str(e)[:80]}'); raise SystemExit
          if isinstance(d,dict):
              arr=d.get('data',d.get('items',[]))
              if isinstance(arr,dict): arr=arr.get('data',[])
          else: arr=d
          if isinstance(arr,list):
              print(f'{name} count={len(arr)}')
              for it in arr[:12]:
                  if isinstance(it,dict):
                      print(f'  Y {it.get("anime_id") or it.get("id")} | {it.get("title")} | {it.get("anime_url") or it.get("slug")} | year={it.get("year")}')
          else:
              print(f'{name} other {str(arr)[:150]}')
          PY
          }
          for base in "https://api.yani.tv" "https://yummyanime.club/api" "https://api.yummyanime.club"; do
            q "YUMMY $base зайка" "$base/search?q=%D0%B7%D0%B0%D0%B9%D0%BA%D0%B0"
          done
          q "YUMMY секс вдвоём" "https://api.yani.tv/search?q=%D0%A1%D0%B5%D0%BA%D1%81%20%D0%B2%D0%B4%D0%B2%D0%BE%D1%91%D0%BC"
          q "YUMMY истории приключений" "https://api.yani.tv/search?q=%D0%98%D1%81%D1%82%D0%BE%D1%80%D0%B8%D1%8F%20%D0%BF%D1%80%D0%B8%D0%BA%D0%BB%D1%8E%D1%87%D0%B5%D0%BD%D0%B8%D0%B9"
          q "ANILIB appsearch Usamimi full" "https://anilibria.top/api/v1/app/search/releases?query=Usamimi%20Bouken-tan%3A%20Sexual%20Harassment&limit=5"
          q "ANILIB appsearch Sexual" "https://anilibria.top/api/v1/app/search/releases?query=Sexual&limit=10"
          q "ANILIB appsearch Ecchi" "https://anilibria.top/api/v1/app/search/releases?query=hentai&limit=10"
          cat $OUT | head -80
      - name: push result
        run: |
          git config user.name "probe"
          git config user.email "probe@local"
          git add probe-result.txt
          git commit -m "probe result 5 [skip ci]" || echo nothing
          git push origin HEAD:arena/01a0afbd-kelemnfno || echo pushfail
