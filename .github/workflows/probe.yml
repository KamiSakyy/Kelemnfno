name: probe
on:
  push:
    paths:
      - '.github/workflows/probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          python3 - <<'PY2'
          import json,urllib.request,urllib.parse
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          H={'User-Agent':UA,'Accept':'application/json, text/plain, */*','Accept-Language':'ru-RU,ru;q=0.9,en;q=0.8','Origin':'https://hanime.tv','Referer':'https://hanime.tv/'}
          out=[]
          def req(url,h=None,method='GET',body=None):
              hh=dict(h or {})
              hh.setdefault('User-Agent',UA)
              data=body.encode() if isinstance(body,str) else body
              r=urllib.request.Request(url,headers=hh,method=method,data=data)
              with urllib.request.urlopen(r,timeout=20) as resp:
                  return resp.status,resp.read()[:400]
          # 1. Shikimori: оригиналы названий для слага hanime
          for host in ['https://shikimori.one/api','https://shikimori.io/api']:
              try:
                  for q in ['%D0%B4%D0%B5%D0%B2%D1%83%D1%88%D0%BA%D0%BE%D0%B9-%D0%B7%D0%B0%D0%B9%D0%BA%D0%BE%D0%B9','%D0%A1%D0%B5%D0%BA%D1%81%20%D0%B2%D0%B4%D0%B2%D0%BE%D1%91%D0%BC','%D0%BF%D0%B0%D1%80%D0%BE%D1%87%D0%BA%D0%B8']:
                      s,b=req(f'{host}/animes?search={q}&limit=3')
                      arr=json.loads(b.decode('utf-8','ignore'))
                      for a in arr:
                          out.append(f"SHIKI {q[:20]} | id={a['id']} | ru={a.get('russian')} | name={a.get('name')}")
                  break
              except Exception as e:
                  out.append(f'SHIKI {host} ERR {e}')
          # 2. hanime video API (не зависит от поиска!) — известный слаг
          for base in ['https://hanime.tv','https://hanime1.com']:
              try:
                  s,b=req(f'{base}/api/v8/video?id=mankitsu-happening',H)
                  out.append(f'HANIME-VIDEO {base} -> {s} {b[:120]}')
              except Exception as e:
                  out.append(f'HANIME-VIDEO {base} ERR {e}')
          # 3. DoH зеркала поиска hanime
          for name in ['search.htv-services.net','search.htv-services.org','search.htv-services.io','htv-services.net','search.hanime.tv','htv-services.org']:
              try:
                  s,b=req(f'https://cloudflare-dns.com/dns-query?name={name}&type=A',{'accept':'application/dns-json'})
                  j=json.loads(b)
                  out.append(f'DoH {name} -> {[a.get("data") for a in j.get("Answer",[]) or []]}')
              except Exception as e:
                  out.append(f'DoH {name} ERR {e}')
          # 4. AnimeLib зеркала/хедеры
          AL={'User-Agent':UA,'Accept':'application/json','Accept-Language':'ru-RU,ru;q=0.9','Origin':'https://animelib.org','Referer':'https://animelib.org/'}
          for u in ['https://api.cdnlibs.org/api/anime?page=1&q=usamimi','https://animelib.org/api/anime?page=1&q=usamimi','https://anilib.me/api/anime?page=1&q=usamimi','https://api.anilib.me/api/anime?page=1&q=usamimi']:
              try:
                  s,b=req(u,AL)
                  out.append(f'ANIMELIB {u} -> {s} {b[:100]}')
              except Exception as e:
                  out.append(f'ANIMELIB {u} ERR {e}')
          # 5. hchan
          for u in ['https://hentai-chan.best/','https://h-chan.me/']:
              try:
                  s,b=req(u,{'User-Agent':UA})
                  out.append(f'HCHAN {u} -> {s} len={len(b)}')
              except Exception as e:
                  out.append(f'HCHAN {u} ERR {e}')
          open('probe-result.txt','w').write('\n'.join(out)+'\n')
          print('\n'.join(out)[:3000])
          PY2
      - name: push result
        run: |
          git config user.name "probe"
          git config user.email "probe@local"
          git add probe-result.txt
          git commit -m "probe result 13 [skip ci]" || echo nothing
          git push origin HEAD:arena/01a0afbd-kelemnfno || echo pushfail
