name: probe
on:
  push:
    paths:
      - '.github/workflows/probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          python3 - <<'PY2'
          import json,urllib.request,urllib.parse,re
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          out=[]
          def get(url,h=None):
              hh={'User-Agent':UA,'Accept-Language':'ru-RU,ru;q=0.9'}
              if h: hh.update(h)
              r=urllib.request.Request(url,headers=hh)
              with urllib.request.urlopen(r,timeout=25) as resp:
                  return resp.status,resp.geturl(),resp.read().decode('utf-8','ignore')
          B='https://manga.h-chan.me'
          found=[]
          for q in ['usamimi','Bouken-tan','зайкой','девушкой-зайкой']:
              try:
                  s,f,b=get(f'{B}/?do=search&subaction=search&searchstory='+urllib.parse.quote(q))
                  v=list(dict.fromkeys(re.findall(r'href="(/video/[0-9]+[^"#]*\.html)"',b)))
                  m=list(dict.fromkeys(re.findall(r'href="(/manga/[0-9]+[^"#]*\.html)"',b)))
                  out.append(f'SEARCH q={q} videos={v[:4]} manga={m[:4]}')
                  if v and not found: found=v
              except Exception as e:
                  out.append(f'SEARCH q={q} ERR {str(e)[:90]}')
          # структура видео-страницы (плеер)
          target=found[0] if found else '/video/53872-bible-black-3-remastered.html'
          try:
              s,f,b=get(B+target)
              t=re.search(r'<title[^>]*>(.*?)</title>',b,re.S)
              out.append(f'VPAGE {target} -> {s} len={len(b)} title={(t.group(1).strip()[:90] if t else "-")}')
              for pat in [r'<iframe[^>]*src="([^"]+)"',r'https?://[^"\'\s<>]*kodik[^"\'\s<>]*',r'https?://[^"\'\s<>]*\.m3u8[^"\'\s<>]*',r'https?://[^"\'\s<>]*\.mp4[^"\'\s<>]*',r'(?:playerUrl|video_url|file|translations)\s*[:=]\s*["\']?([^"\',}]{10,140})']:
                  mm=list(dict.fromkeys(re.findall(pat,b)))
                  if mm: out.append(f'   {pat[:24]}: {[x[:130] for x in mm[:4]]}')
          except Exception as e:
              out.append(f'VPAGE ERR {str(e)[:100]}')
          open('probe-result.txt','w').write('\n'.join(out)+'\n')
          print('\n'.join(out)[:3400])
          PY2
      - name: push result
        run: |
          git config user.name "probe"
          git config user.email "probe@local"
          git add probe-result.txt
          git commit -m "probe result 20 [skip ci]" || echo nothing
          git push origin HEAD:arena/01a0afbd-kelemnfno || echo pushfail
