name: probe
on:
  push:
    paths:
      - '.github/workflows/probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          python3 - <<'PY'
          import json,urllib.request
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          out=[]
          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':UA})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r: return json.loads(r.read().decode('utf-8','ignore'))
              except Exception as e:
                  return {'err':str(e)[:120]}
          qs={'зайка':'%D0%B7%D0%B0%D0%B9%D0%BA%D0%B0','секс вдвоём':'%D0%A1%D0%B5%D0%BA%D1%81%20%D0%B2%D0%B4%D0%B2%D0%BE%D1%91%D0%BC',
              'Usamimi':'Usamimi','история приключений':'%D0%98%D1%81%D1%82%D0%BE%D1%80%D0%B8%D1%8F%20%D0%BF%D1%80%D0%B8%D0%BA%D0%BB%D1%8E%D1%87%D0%B5%D0%BD%D0%B8%D0%B9',
              'хентай':'%D1%85%D0%B5%D0%BD%D1%82%D0%B0%D0%B9','Incha':'Incha','Isshoni':'Issho%20ni'}
          for name,enc in qs.items():
              d=fetch(f'https://api.yani.tv/search?q={enc}')
              arr=d.get('response',[]) if isinstance(d,dict) else []
              out.append(f'== YUMMY {name} count={len(arr)}')
              for it in arr[:15]:
                  out.append(f"  Y {it.get('id')} | {it.get('title')} | url={it.get('url') or it.get('anime_url') or it.get('slug')} | year={it.get('year')} | min_age={it.get('min_age')}")
          open('probe-result.txt','w').write('\n'.join(out)+'\n')
          print('\n'.join(out)[:3000])
          PY
      - name: push result
        run: |
          git config user.name "probe"
          git config user.email "probe@local"
          git add probe-result.txt
          git commit -m "probe result 7b [skip ci]" || echo nothing
          git push origin HEAD:arena/01a0afbd-kelemnfno || echo pushfail
