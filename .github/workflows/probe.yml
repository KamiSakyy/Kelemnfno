name: probe
on:
  push:
    paths:
      - '.github/workflows/probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          OUT=probe-result.txt
          : > $OUT
          i=0
          for q in "Секс вдвоём" "Issho ni Ecchi" "История парочки" "Incha Couple" "девушкой-зайкой" "Usamimi Bouken-tan" "зайкой" "Bouken-tan"; do
            i=$((i+1))
            eq=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$q")
            curl -s --max-time 30 -H "User-Agent: $UA" "https://anilibria.top/api/v1/app/search/releases?query=$eq&limit=10" -o /tmp/a$i.json || true
            echo "$i=$q" >> /tmp/map.txt
          done
          python3 - <<'PY' >> $OUT
          import json
          for line in open('/tmp/map.txt'):
              i,q=line.strip().split('=',1)
              try: d=json.load(open(f'/tmp/a{i}.json'))
              except Exception as e: print(f'== APPSEARCH {q} ERR {e}'); continue
              arr=d if isinstance(d,list) else d.get('data',[]) if isinstance(d,dict) else []
              print(f'== APPSEARCH {q} count={len(arr)}')
              for r in arr[:10]:
                  if isinstance(r,dict):
                      n=r.get('name',{}) if isinstance(r.get('name'),dict) else {}
                      print(f'A {r.get("id")} | {n.get("main")} | {n.get("english")} | eps={len(r.get("episodes") or [])}')
                  else:
                      print(f'A raw={str(r)[:120]}')
          PY
          M3U=$(curl -s --max-time 30 -H "User-Agent: $UA" "https://anilibria.top/api/v1/anime/releases/9738" | python3 -c "import json,sys;d=json.load(sys.stdin);r=d.get('data',d);eps=r.get('episodes') or [];print(eps[0].get('hls_480') if eps else '')")
          echo "== M3U URL: $M3U" >> $OUT
          for mode in plain ua ref uaref; do
            case $mode in
              plain) code=$(curl -s -o /tmp/m.plain -w "%{http_code}" --max-time 20 "$M3U");;
              ua) code=$(curl -s -o /tmp/m.ua -w "%{http_code}" --max-time 20 -H "User-Agent: $UA" "$M3U");;
              ref) code=$(curl -s -o /tmp/m.ref -w "%{http_code}" --max-time 20 -H "Referer: https://anilibria.top/" "$M3U");;
              uaref) code=$(curl -s -o /tmp/m.uaref -w "%{http_code}" --max-time 20 -H "User-Agent: $UA" -H "Referer: https://anilibria.top/" "$M3U");;
            esac
            echo "== M3U $mode -> HTTP $code size $(stat -c%s /tmp/m.$mode 2>/dev/null || echo 0)" >> $OUT
          done
          echo "== M3U head:" >> $OUT
          head -c 500 /tmp/m.uaref >> $OUT
          echo "" >> $OUT
          SEG=$(grep -v "^#" /tmp/m.uaref | head -1)
          echo "== SEG1: $SEG" >> $OUT
          case "$SEG" in /*) SEG="https://cache.libria.fun$SEG";; http*) ;; *) SEG="";; esac
          if [ -n "$SEG" ]; then
            code=$(curl -s -o /tmp/s1 -w "%{http_code}" --max-time 20 -H "User-Agent: $UA" -H "Referer: https://anilibria.top/" "$SEG")
            echo "== SEG fetch -> HTTP $code size $(stat -c%s /tmp/s1 2>/dev/null || echo 0)" >> $OUT
          fi
          cat $OUT | head -80
      - name: push result
        run: |
          git config user.name "probe"
          git config user.email "probe@local"
          git add probe-result.txt
          git commit -m "probe result 2 [skip ci]" || echo nothing
          git push origin HEAD:arena/01a0afbd-kelemnfno || echo pushfail
