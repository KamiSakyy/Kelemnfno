name: probe
on:
  push:
    paths:
      - '.github/workflows/probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          python3 - <<'PY'
          import json,urllib.request
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          out=[]
          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':UA})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r: return json.loads(r.read().decode('utf-8','ignore'))
              except Exception as e:
                  return {'err':str(e)[:100]}
          urls={
           'search+is_adult':'https://anilibria.top/api/v1/app/search/releases?query=Usamimi%20Bouken-tan&limit=5&is_adult=1',
           'search+adult':'https://anilibria.top/api/v1/app/search/releases?query=Usamimi%20Bouken-tan&limit=5&adult=1',
           'search+age':'https://anilibria.top/api/v1/app/search/releases?query=Usamimi%20Bouken-tan&limit=5&f%5Bage_ratings%5D=R18_PLUS',
           'catalog XXX':'https://anilibria.top/api/v1/anime/catalog/releases?f%5Bage_ratings%5D=XXX&limit=50',
           'catalog ADULT':'https://anilibria.top/api/v1/anime/catalog/releases?f%5Bage_ratings%5D=ADULT&limit=50',
           'catalog hentai genre name':'https://anilibria.top/api/v1/anime/catalog/releases?f%5Bgenres%5D=%D0%A5%D0%B5%D0%BD%D1%82%D0%B0%D0%B9&limit=50',
           'old tv v3':'https://api.anilibria.tv/v3/title/search?search=Usamimi',
           'anilibria.tv root':'https://anilibria.tv/api/v1/anime/catalog/releases?limit=3',
          }
          for name,url in urls.items():
              d=fetch(url)
              if isinstance(d,dict) and 'err' in d:
                  out.append(f'== {name}: ERR {d["err"]}'); continue
              if isinstance(d,list):
                  out.append(f'== {name}: list {len(d)}'); 
                  for r in d[:6]:
                      n=r.get('name',{}) if isinstance(r,dict) and isinstance(r.get('name'),dict) else {}
                      out.append(f"   {r.get('id')} | {n.get('main')} | {n.get('english')}")
              elif isinstance(d,dict):
                  arr=d.get('data',[])
                  meta=d.get('meta',{}).get('pagination',{}) if isinstance(d.get('meta'),dict) else {}
                  out.append(f'== {name}: total={meta.get("total")} count={len(arr) if isinstance(arr,list) else "-"}')
                  for r in (arr or [])[:6]:
                      n=r.get('name',{}) if isinstance(r,dict) and isinstance(r.get('name'),dict) else {}
                      out.append(f"   {r.get('id')} | {n.get('main')} | {n.get('english')}")
              else:
                  out.append(f'== {name}: {str(d)[:120]}')
          open('probe-result.txt','w').write('\n'.join(out)+'\n')
          print('\n'.join(out)[:2500])
          PY
      - name: push result
        run: |
          git config user.name "probe"
          git config user.email "probe@local"
          git add probe-result.txt
          git commit -m "probe result 8 [skip ci]" || echo nothing
          git push origin HEAD:arena/01a0afbd-kelemnfno || echo pushfail
