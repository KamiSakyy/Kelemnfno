name: probe
on:
  push:
    paths:
      - '.github/workflows/probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          python3 - <<'PY2'
          import json,urllib.request,urllib.parse,re
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          out=[]
          def get(url,h=None):
              hh={'User-Agent':UA,'Accept-Language':'ru-RU,ru;q=0.9'}
              if h: hh.update(h)
              r=urllib.request.Request(url,headers=hh)
              with urllib.request.urlopen(r,timeout=25) as resp:
                  return resp.status,resp.geturl(),resp.read().decode('utf-8','ignore')
          for u in ['https://manga.h-chan.me/','https://x3.h-chan.me/','https://xxl.hentaichan.live/','https://anime-chan.me/','https://x.henchan.pro/','https://henchan.pro/']:
              try:
                  s,f,b=get(u)
                  t=re.search(r'<title[^>]*>(.*?)</title>',b,re.S)
                  out.append(f'MIRROR {u} -> {s} final={f} len={len(b)} title={(t.group(1).strip()[:80] if t else "-")}')
              except Exception as e:
                  out.append(f'MIRROR {u} ERR {str(e)[:110]}')
          # живое зеркало: поиск + страница + видео
          alive=None
          for u in ['https://x.henchan.pro/','https://manga.h-chan.me/','https://xxl.hentaichan.live/']:
              try:
                  s,f,b=get(u)
                  if s==200 and len(b)>3000: alive=u.rstrip('/'); break
              except Exception: pass
          if alive:
              out.append(f'ALIVE={alive}')
              for u in [alive+'/?do=search&subaction=search&searchstory=usamimi',alive+'/manga/usamimi-bouken-tan']:
                  try:
                      s,f,b=get(u)
                      t=re.search(r'<title[^>]*>(.*?)</title>',b,re.S)
                      out.append(f'  PAGE {u[len(alive):][:50] or "/"} -> {s} len={len(b)} title={(t.group(1).strip()[:90] if t else "-")}')
                      links=list(dict.fromkeys(re.findall(r'/manga/[a-z0-9\-]+',b)))[:6]
                      out.append(f'  manga-links: {links}')
                      for pat in [r'https?://[^"\'\s<>]*kodik[^"\'\s<>]*',r'https?://[^"\'\s<>]*\.m3u8[^"\'\s<>]*',r'https?://[^"\'\s<>]*\.mp4[^"\'\s<>]*']:
                          m=list(dict.fromkeys(re.findall(pat,b)))
                          if m: out.append(f'  {pat[:24]}: {m[:3]}')
                  except Exception as e:
                      out.append(f'  PAGE {u[:60]} ERR {str(e)[:110]}')
          # shikimori.tv
          for u in ['https://shikimori.tv/api/animes?search=usamimi&limit=2','https://shikimori.tv/api/animes?limit=1']:
              try:
                  s,f,b=get(u,{'User-Agent':'KelemnfnoApp'})
                  out.append(f'SHIKITV {u[20:60]} -> {s} {b[:120]}')
              except Exception as e:
                  out.append(f'SHIKITV {u[20:60]} ERR {str(e)[:110]}')
          open('probe-result.txt','w').write('\n'.join(out)+'\n')
          print('\n'.join(out)[:3200])
          PY2
      - name: push result
        run: |
          git config user.name "probe"
          git config user.email "probe@local"
          git add probe-result.txt
          git commit -m "probe result 17 [skip ci]" || echo nothing
          git push origin HEAD:arena/01a0afbd-kelemnfno || echo pushfail
