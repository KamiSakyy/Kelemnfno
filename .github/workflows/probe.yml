name: probe
on:
  push:
    paths:
      - '.github/workflows/probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          OUT=probe-result.txt
          : > $OUT
          for q in "%D0%B7%D0%B0%D0%B9%D0%BA%D0%B0" "%D0%A1%D0%B5%D0%BA%D1%81%20%D0%B2%D0%B4%D0%B2%D0%BE%D1%91%D0%BC" "Usamimi" "%D0%98%D1%81%D1%82%D0%BE%D1%80%D0%B8%D1%8F%20%D0%BF%D1%80%D0%B8%D0%BA%D0%BB%D1%8E%D1%87%D0%B5%D0%BD%D0%B8%D0%B9" "%D1%85%D0%B5%D0%BD%D1%82%D0%B0%D0%B9" "Incha" "Isshо"; do
            echo "== YUMMY $q" >> $OUT
            curl -s --max-time 20 -H "User-Agent: $UA" "https://api.yani.tv/search?q=$q" | python3 -c "
import json,sys
try: d=json.load(sys.stdin)
except Exception as e: print('ERR',e); raise SystemExit
for it in d.get('response',[]):
    print('  Y', it.get('id'), '|', it.get('title'), '|', it.get('url') or it.get('anime_url') or it.get('slug'), '|', it.get('year'))
" >> $OUT
          done
          cat $OUT | head -120
      - name: push result
        run: |
          git config user.name "probe"
          git config user.email "probe@local"
          git add probe-result.txt
          git commit -m "probe result 5 [skip ci]" || echo nothing
          git push origin HEAD:arena/01a0afbd-kelemnfno || echo pushfail
