name: probe
on:
  push:
    paths:
      - '.github/workflows/probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          python3 - <<'PY2'
          import json,urllib.request,urllib.parse,re
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          out=[]
          def get(url,h=None):
              hh={'User-Agent':UA,'Accept-Language':'ru-RU,ru;q=0.9'}
              if h: hh.update(h)
              r=urllib.request.Request(url,headers=hh)
              with urllib.request.urlopen(r,timeout=25) as resp:
                  return resp.status,resp.geturl(),resp.read().decode('utf-8','ignore')
          # 1. h-chan главная
          for u in ['https://h-chan.me/','https://h-chan.me/my/list']:
              try:
                  s,f,b=get(u)
                  out.append(f'HCHAN {u} -> {s} final={f} len={len(b)}')
                  out.append('   head: '+re.sub(r'\s+',' ',b[:300]))
              except Exception as e:
                  out.append(f'HCHAN {u} ERR {str(e)[:120]}')
          # 2. страница манги/видео по слагу
          for u in ['https://h-chan.me/manga/usamimi-bouken-tan','https://h-chan.me/manga/futari-ecchi']:
              try:
                  s,f,b=get(u)
                  out.append(f'HCHAN-PAGE {u} -> {s} len={len(b)}')
                  t=re.search(r'<title[^>]*>(.*?)</title>',b,re.S)
                  out.append('   title: '+(t.group(1).strip()[:120] if t else '-'))
                  for pat in [r'https?://[^"\'\s]*kodik[^"\'\s]*',r'https?://[^"\'\s]*\.m3u8[^"\'\s]*',r'https?://[^"\'\s]*\.mp4[^"\'\s]*',r'https?://video[^"\'\s]*']:
                      m=re.findall(pat,b)
                      if m: out.append(f'   {pat[:20]}: {m[:2]}')
              except Exception as e:
                  out.append(f'HCHAN-PAGE {u} ERR {str(e)[:120]}')
          # 3. поиск h-chan (AJAX варианты)
          for u in ['https://h-chan.me/search?query=usamimi','https://h-chan.me/manga/search?query=usamimi','https://h-chan.me/ajax/manga/search?query=usamimi']:
              try:
                  s,f,b=get(u)
                  out.append(f'HCHAN-SEARCH {u} -> {s} len={len(b)} :: {re.sub(chr(10)," ",b[:150])}')
              except Exception as e:
                  out.append(f'HCHAN-SEARCH {u} ERR {str(e)[:100]}')
          # 4. DoH зеркала
          for name in ['h-chan.fun','hentai-chan.fun','h-chan.ru','hentaichan.ru']:
              try:
                  s,f,b=get(f'https://cloudflare-dns.com/dns-query?name={name}&type=A',{'accept':'application/dns-json'})
                  j=json.loads(b)
                  out.append(f'DoH {name} -> {[a.get("data") for a in j.get("Answer",[]) or []]}')
              except Exception as e:
                  out.append(f'DoH {name} ERR {str(e)[:80]}')
          # 5. AnimeLib латиницей
          AL={'User-Agent':UA,'Accept':'application/json','Origin':'https://animelib.org','Referer':'https://animelib.org/'}
          for q in ['Bouken','Futari Ecchi']:
              try:
                  s,f,b=get('https://api.cdnlibs.org/api/anime?page=1&q='+urllib.parse.quote(q),AL)
                  j=json.loads(b)
                  rows=j.get('data',[])
                  out.append(f'AL q={q} count={len(rows)} :: '+str([ (r.get("slug_url"),r.get("rus_name")) for r in rows[:4]]))
              except Exception as e:
                  out.append(f'AL q={q} ERR {str(e)[:100]}')
          open('probe-result.txt','w').write('\n'.join(out)+'\n')
          print('\n'.join(out)[:3000])
          PY2
      - name: push result
        run: |
          git config user.name "probe"
          git config user.email "probe@local"
          git add probe-result.txt
          git commit -m "probe result 15 [skip ci]" || echo nothing
          git push origin HEAD:arena/01a0afbd-kelemnfno || echo pushfail
