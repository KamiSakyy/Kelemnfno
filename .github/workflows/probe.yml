name: probe
on:
  push:
    paths:
      - '.github/workflows/probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          python3 - <<'PY2'
          import json,urllib.request,socket
          out=[]
          for host in ["search.htv-services.com","hanime.tv","www.hanime.tv","htv-services.com"]:
              try:
                  ip=socket.gethostbyname(host); out.append(f'DNS {host} -> {ip}')
              except Exception as e:
                  out.append(f'DNS {host} ERR {e}')
          def doh(name):
              try:
                  req=urllib.request.Request(f'https://cloudflare-dns.com/dns-query?name={name}&type=A',headers={'Accept':'application/dns-json','User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=15) as r: d=json.loads(r.read())
                  return [(a.get('address')) for a in d.get('Answer',[]) if a.get('type')==1]
              except Exception as e:
                  return [f'ERR {e}']
          for host in ["search.htv-services.com","hanime.tv"]:
              out.append(f'DoH {host} -> {doh(host)}')
          try:
              req=urllib.request.Request('https://hanime.tv/',headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=15) as r:
                  out.append(f'GET hanime.tv -> {r.status} len={len(r.read())}')
          except Exception as e:
              out.append(f'GET hanime.tv ERR {str(e)[:120]}')
          try:
              req=urllib.request.Request('https://search.htv-services.com/',data=b'{}',headers={'User-Agent':'Mozilla/5.0','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=15) as r:
                  out.append(f'POST htv -> {r.status} len={len(r.read())}')
          except Exception as e:
              out.append(f'POST htv ERR {str(e)[:120]}')
          open('probe-result.txt','w').write('\n'.join(out)+'\n')
          print('\n'.join(out))
          PY2
      - name: push result
        run: |
          git config user.name "probe"
          git config user.email "probe@local"
          git add probe-result.txt
          git commit -m "probe result 9 [skip ci]" || echo nothing
          git push origin HEAD:arena/01a0afbd-kelemnfno || echo pushfail
