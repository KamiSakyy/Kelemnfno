name: probe
on:
  push:
    paths:
      - '.github/workflows/probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          python3 - <<'PY'
          import json,urllib.request
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          H={'User-Agent':UA,'Accept':'application/json','Origin':'https://hanime.tv','Referer':'https://hanime.tv/','Content-Type':'application/json'}
          out=[]
          def post(url,body):
              req=urllib.request.Request(url,data=json.dumps(body).encode(),headers=H,method='POST')
              with urllib.request.urlopen(req,timeout=20) as r: return r.read().decode('utf-8','ignore')
          def get(url):
              req=urllib.request.Request(url,headers=H)
              with urllib.request.urlopen(req,timeout=20) as r: return r.read().decode('utf-8','ignore')
          for title in ["Usamimi Bouken-tan","Isshо ni Ecchi","Incha Couple"]:
              try:
                  root=post("https://search.htv-services.com/",{"search_text":title,"tags":[],"tags_mode":"AND","brands":[],"blacklist":[],"order_by":"created_at_unix","ordering":"desc","page":0})
                  parsed=json.loads(root)
                  hits=json.loads(parsed.get('hits','[]')) if isinstance(parsed.get('hits'),str) else (parsed.get('hits') or [])
                  out.append(f'== HANIME SEARCH {title} hits={len(hits)}')
                  for h in hits[:4]:
                      out.append(f"   slug={h.get('slug')} | name={h.get('name')} | titles={str(h.get('titles'))[:80]}")
                  if hits:
                      slug=hits[0].get('slug')
                      d=json.loads(get(f"https://hanime.tv/api/v8/video?id={urllib.request.quote(str(slug))}"))
                      man=d.get('videos_manifest') or {}
                      servers=man.get('servers') or []
                      out.append(f'   VIDEO {slug} servers={len(servers)}')
                      for s in servers[:3]:
                          for st in (s.get('streams') or [])[:4]:
                              out.append(f"     h={st.get('height')} url={str(st.get('url'))[:110]}")
              except Exception as e:
                  out.append(f'== HANIME SEARCH {title} ERR {str(e)[:120]}')
          open('probe-result.txt','w').write('\n'.join(out)+'\n')
          print('\n'.join(out)[:2800])
          PY
      - name: push result
        run: |
          git config user.name "probe"
          git config user.email "probe@local"
          git add probe-result.txt
          git commit -m "probe result 9 [skip ci]" || echo nothing
          git push origin HEAD:arena/01a0afbd-kelemnfno || echo pushfail
