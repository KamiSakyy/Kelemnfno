name: probe
on:
  push:
    branches: [arena/01a0afbd-kelemnfno]
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          UA='Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36'
          {
            echo '=== headers shikimori.one ==='
            curl -sSI -A "$UA" 'https://shikimori.one/api/animes?genre=hentai&limit=2&censored=false' | head -20
            echo '=== follow shikimori.one ==='
            curl -sSL -A "$UA" 'https://shikimori.one/api/animes?genre=hentai&limit=2&censored=false' | head -c 1800
            echo
            echo '=== shikimori.me direct ==='
            curl -sS -A "$UA" 'https://shikimori.me/api/animes?genre=hentai&limit=2&censored=false' | head -c 1200
          } > probe-result.txt 2>&1
      - name: commit result
        run: |
          git config user.name "probe"
          git config user.email "probe@local"
          git add probe-result.txt
          git commit -m "probe result 3" || true
          git pull --rebase
          git push
