name: probe
on:
  push:
    paths:
      - '.github/workflows/probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          python3 - <<'PY2'
          import json,urllib.request,urllib.parse,re
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          out=[]
          def get(url,h=None):
              hh={'User-Agent':UA,'Accept-Language':'ru-RU,ru;q=0.9'}
              if h: hh.update(h)
              r=urllib.request.Request(url,headers=hh)
              with urllib.request.urlopen(r,timeout=25) as resp:
                  return resp.status,resp.geturl(),resp.read().decode('utf-8','ignore')
          B='https://manga.h-chan.me'
          # поиск: русские и английские запросы, дамп href
          found=[]
          for q in ['usamimi','зайкой','Usamimi Bouken-tan']:
              try:
                  s,f,b=get(f'{B}/?do=search&subaction=search&searchstory='+urllib.parse.quote(q))
                  hrefs=list(dict.fromkeys(re.findall(r'href="(/manga/[^"#]+)"',b)))
                  out.append(f'SEARCH q={q} -> {s} len={len(b)} hrefs={hrefs[:6]}')
                  if hrefs and not found: found=hrefs
              except Exception as e:
                  out.append(f'SEARCH q={q} ERR {str(e)[:100]}')
          # AJAX поиск (DLE)
          for u in [B+'/engine/ajax/search.php?query=usamimi']:
              try:
                  s,f,b=get(u)
                  out.append(f'AJAX {u[len(B):]} -> {s} {b[:200]}')
              except Exception as e:
                  out.append(f'AJAX ERR {str(e)[:100]}')
          # страница найденной манги: ищем видео-плеер
          if found:
              u=B+found[0]
              try:
                  s,f,b=get(u)
                  t=re.search(r'<title[^>]*>(.*?)</title>',b,re.S)
                  out.append(f'MANGA {found[0]} -> {s} len={len(b)} title={(t.group(1).strip()[:90] if t else "-")}')
                  for pat in [r'https?://[^"\'\s<>]*kodik[^"\'\s<>]*',r'https?://[^"\'\s<>]*\.m3u8[^"\'\s<>]*',r'https?://[^"\'\s<>]*\.mp4[^"\'\s<>]*',r'<iframe[^>]*src="([^"]+)"',r'video[^"\'\s<>]{0,80}']:
                      m=list(dict.fromkeys(re.findall(pat,b)))
                      if m: out.append(f'   {pat[:26]}: {[x[:120] for x in m[:4]]}')
                  # ссылки на "смотреть видео"
                  vlinks=list(dict.fromkeys(re.findall(r'href="(/(?:video|anime)[^"#]*)"',b)))
                  out.append(f'   vlinks: {vlinks[:5]}')
                  # их плеер может лежать в /engine или js-переменной
                  for pat in [r'(?:playerUrl|video_url|file)\s*[:=]\s*["\']([^"\']+)',r'data-src="([^"]+)"']:
                      m=list(dict.fromkeys(re.findall(pat,b)))
                      if m: out.append(f'   {pat[:20]}: {[x[:120] for x in m[:3]]}')
              except Exception as e:
                  out.append(f'MANGA {found[0]} ERR {str(e)[:100]}')
          else:
              # прямой слаг-гесс с .html
              for slug in ['usamimi-bouken-tan.html','usamimi-bouken-tan']:
                  try:
                      s,f,b=get(f'{B}/manga/{slug}')
                      out.append(f'DIRECT /manga/{slug} -> {s} len={len(b)}')
                  except Exception as e:
                      out.append(f'DIRECT /manga/{slug} ERR {str(e)[:80]}')
          open('probe-result.txt','w').write('\n'.join(out)+'\n')
          print('\n'.join(out)[:3400])
          PY2
      - name: push result
        run: |
          git config user.name "probe"
          git config user.email "probe@local"
          git add probe-result.txt
          git commit -m "probe result 18 [skip ci]" || echo nothing
          git push origin HEAD:arena/01a0afbd-kelemnfno || echo pushfail
