name: probe
on:
  push:
    paths:
      - '.github/workflows/probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          python3 - <<'PY2'
          import json,urllib.request,urllib.parse,re
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          out=[]
          def get(url,h=None):
              hh={'User-Agent':UA,'Accept-Language':'ru-RU,ru;q=0.9','Accept':'*/*'}
              if h: hh.update(h)
              r=urllib.request.Request(url,headers=hh)
              with urllib.request.urlopen(r,timeout=25) as resp:
                  return resp.status,resp.geturl(),resp.read().decode('utf-8','ignore')
          B='https://manga.h-chan.me'
          # 1. главная: SPA-подсказки (api-эндпоинты в JS)
          try:
              s,f,b=get(B+'/')
              apis=list(dict.fromkeys(re.findall(r'["\'](/(?:api|ajax)[a-zA-Z0-9_/\-]*)["\']',b)))
              scripts=list(dict.fromkeys(re.findall(r'src="([^"]+\.js[^"]*)"',b)))
              out.append(f'HOME len={len(b)} apis={apis[:10]}')
              out.append(f'  scripts={scripts[:5]}')
              for js in scripts[:3]:
                  try:
                      u=js if js.startswith('http') else B+js
                      _,_,jb=get(u)
                      hits=list(dict.fromkeys(re.findall(r'["\'](?:https?://[^"\']*)?/(?:api|manga|video)/[a-zA-Z0-9_/\-\.{}$]*["\']',jb)))
                      if hits: out.append(f'  JS {js[-40:]}: {hits[:12]}')
                  except Exception as e:
                      out.append(f'  JS {js[-40:]} ERR {str(e)[:60]}')
          except Exception as e:
              out.append(f'HOME ERR {str(e)[:100]}')
          # 2. видео-разделы
          for u in [B+'/video/hentai',B+'/video/new',B+'/video/usamimi-bouken-tan']:
              try:
                  s,f,b=get(u)
                  hrefs=list(dict.fromkeys(re.findall(r'href="(/video/[^"#]+)"',b)))
                  t=re.search(r'<title[^>]*>(.*?)</title>',b,re.S)
                  out.append(f'VIDEO {u[len(B):]} -> {s} len={len(b)} title={(t.group(1).strip()[:60] if t else "-")} hrefs={hrefs[:8]}')
              except Exception as e:
                  out.append(f'VIDEO {u[len(B):]} ERR {str(e)[:90]}')
          # 3. типовые API-пути
          for u in [B+'/api/manga/search?query=usamimi',B+'/api/video/search?query=usamimi',B+'/ajax/search?query=usamimi',B+'/manga/usamimi-bouken-tan.json']:
              try:
                  s,f,b=get(u)
                  out.append(f'API {u[len(B):]} -> {s} {b[:150]}')
              except Exception as e:
                  out.append(f'API {u[len(B):]} ERR {str(e)[:80]}')
          open('probe-result.txt','w').write('\n'.join(out)+'\n')
          print('\n'.join(out)[:3400])
          PY2
      - name: push result
        run: |
          git config user.name "probe"
          git config user.email "probe@local"
          git add probe-result.txt
          git commit -m "probe result 19 [skip ci]" || echo nothing
          git push origin HEAD:arena/01a0afbd-kelemnfno || echo pushfail
