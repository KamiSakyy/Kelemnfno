name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # SDK уже стоит на образе runner'а — сторонние экшены не используем.
      - name: Inspect preinstalled Android SDK
        run: |
          set -x
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME" || true
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
          ls "$ANDROID_HOME/cmdline-tools" || true
          command -v sdkmanager || true
          echo "sdk-info=ANDROID_HOME=$ANDROID_HOME platforms=[$(ls "$ANDROID_HOME/platforms" 2>/dev/null | tr '\n' ' ')] build-tools=[$(ls "$ANDROID_HOME/build-tools" 2>/dev/null | tr '\n' ' ')] cmdline=[$(ls "$ANDROID_HOME/cmdline-tools" 2>/dev/null | tr '\n' ' ')]" >> "$GITHUB_ENV"

      - name: Report SDK info
        run: echo "::notice::$sdk_info"

      - name: Accept licenses and install SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager не найден в $ANDROID_HOME"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "installed=[$("$SDKMANAGER" --list_installed 2>/dev/null | tr '\n' ' ')]" >> "$GITHUB_ENV"

      - name: Report installed packages
        run: echo "::notice::$installed"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log

      # Логи джоба снаружи не всегда доступны, поэтому дублируем ошибки в аннотации.
      - name: Publish build errors as annotations
        if: steps.build.outcome == 'failure'
        run: |
          echo "===== tail ====="
          tail -n 120 build.log
          grep -nE "error:|FAILURE:|What went wrong|Caused by:|Execution failed|AAPT:|Exception|\.java:[0-9]+" build.log \
            | head -n 40 \
            | while IFS= read -r line; do
                printf '::error::%s\n' "${line:0:900}"
              done
          echo "::error::Сборка упала — см. аннотации выше (build.log в артефакте лога)"
          exit 1

      - name: Rename artifact
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/Kelemnfno-debug.apk
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kelemnfno-debug-apk
          path: out/Kelemnfno-debug.apk
          if-no-files-found: error

      - name: Publish APK to release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Kelemnfno nightly build
          body: |
            Автоматическая сборка ветки `${{ github.ref_name }}` (commit `${{ github.sha }}`).

            **Kelemnfno-debug.apk** — установочный файл приложения.
          files: out/Kelemnfno-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
