name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # SDK уже стоит на образе runner'а — сторонние экшены не используем.
      - name: Inspect preinstalled Android SDK
        run: |
          set -x
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME" || true
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
          ls "$ANDROID_HOME/cmdline-tools" || true
          command -v sdkmanager || true
          echo "sdkinfo=ANDROID_HOME=$ANDROID_HOME platforms=[$(ls "$ANDROID_HOME/platforms" 2>/dev/null | tr '\n' ' ')] build-tools=[$(ls "$ANDROID_HOME/build-tools" 2>/dev/null | tr '\n' ' ')] cmdline=[$(ls "$ANDROID_HOME/cmdline-tools" 2>/dev/null | tr '\n' ' ')]" >> "$GITHUB_ENV"

      - name: Report SDK info
        run: echo "::notice::$sdkinfo"

      - name: Accept licenses and install SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager не найден в $ANDROID_HOME"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "installed=[$("$SDKMANAGER" --list_installed 2>/dev/null | tr '\n' ' ')]" >> "$GITHUB_ENV"

      - name: Report installed packages
        run: echo "::notice::$installed"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log

      # Логи джоба снаружи не всегда доступны, поэтому дублируем ошибки в аннотации.
      - name: Publish build errors as annotations
        if: always()
        run: |
          set +e
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ -f "$APK" ]; then
            echo "::notice::APK собран: $(stat -c%s "$APK") байт"
            exit 0
          fi
          echo "::error::APK не собран, outcome сборки: ${{ steps.build.outcome }}"
          grep -A2 -E "[^ ]+\.java:[0-9]+: error:" build.log 2>/dev/null | tr '\n' '~' | sed 's/~~/~/g' \
            | tr '~' '\n' | grep -E "\.java:[0-9]+: error:|symbol:|location:" | head -n 90 \
            | while IFS= read -r l; do printf '::error::JAVA %s\n' "${l:0:400}"; done
          grep -oE "[^ ]+\.java:[0-9]+: (warning|error)" build.log 2>/dev/null | sort -u | wc -l \
            | sed 's/^/::notice::Всего уникальных строк с ошибками в .java: /'
          grep -nE "error:|FAILURE|Caused by|What went wrong|Execution failed|AAPT" build.log 2>/dev/null \
            | grep -v "\.java:" | head -n 15 | while IFS= read -r l; do printf '::error::%s\n' "${l:0:400}"; done
          exit 1

      - name: Rename artifact
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/Kelemnfno-debug.apk
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kelemnfno-debug-apk
          path: out/Kelemnfno-debug.apk
          if-no-files-found: error

      # Прямая отдача файла: релиз-ассеты наружу не всегда достижимы,
      # поэтому кладём APK ещё и в саму ветку (git-протокол доступен всегда).
      - name: Commit APK into branch
        if: github.event_name == 'push'
        run: |
          git config user.name "kelemnfno-ci"
          git config user.email "ci@kelemnfno.local"
          cp out/Kelemnfno-debug.apk Kelemnfno-debug.apk
          git add -f Kelemnfno-debug.apk
          git commit -m "APK ${GITHUB_SHA::7}: Kelemnfno-debug.apk [skip ci]" || echo "APK не изменился"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish APK to release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Kelemnfno nightly build
          body: |
            Автоматическая сборка ветки `${{ github.ref_name }}` (commit `${{ github.sha }}`).

            **Kelemnfno-debug.apk** — установочный файл приложения.
          files: out/Kelemnfno-debug.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
